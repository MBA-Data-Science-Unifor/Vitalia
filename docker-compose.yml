services:
  vitalia:
    build:
      context: .
      dockerfile: Dockerfile
    image: vitalia:latest
    container_name: vitalia
    ports:
      - "8501:8501"
    environment:
      HF_HOME: /home/appuser/app/.cache/huggingface
      TRANSFORMERS_CACHE: /home/appuser/app/.cache/huggingface
      TOKENIZERS_PARALLELISM: "false"
      PYTHONUNBUFFERED: "1"
      # HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN}
    volumes:
      - hf_cache:/home/appuser/app/.cache/huggingface
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  hf_cache: