# ============================================================
# CONFIGURAÇÃO — Vitalia
# ============================================================

base_model: "pierreguillou/gpt2-small-portuguese"

models:
  Ruim:  "model/modelo_ruim/epoca_1"
  Bom:   "model/modelo_bom/epoca_5"
  Ótimo: "model/modelo_otimo/epoca_10"

model_epochs:
  Ruim:  1
  Bom:   5
  Ótimo: 10

default_model: "Bom"

# IDÊNTICO ao formatar() do notebook
prompt_template: |
  ### Pergunta:
  {instruction}

  ### Resposta:

# Defaults — espelham o bloco generation: do notebook
generation:
  max_new_tokens: 70
  do_sample: false
  num_beams: 4
  repetition_penalty: 2.2
  no_repeat_ngram_size: 4
  temperature: 0.7
  top_p: 0.9
  top_k: 50
  length_penalty: 1.0
  early_stopping: false
  seed: 42
  cut_first_sentence: true   # notebook cortava na 1ª frase

training_reference:
  epochs: 10
  learning_rate: 0.0001
  batch_size: 4
  max_length: 256
  weight_decay: 0.01
  label_smoothing: 0.0
  lora_r: 4
  lora_alpha: 8
  lora_dropout: 0.1
  lora_target_modules: ['c_attn']
  data_path: "saude.jsonl"
  validation_split: 0.20
  seed: 42
  early_stopping_patience: 3
  early_stopping_threshold: 0.001
  comparacao_epocas:
    Ruim: 1
    Bom: 5
    Ótimo: 10